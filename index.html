<script>
/* ===== helpers ===== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - t, 3);
// minimum-jerk easing: the bell-shaped speed profile of a natural human reach
const mj = x => { x = clamp(x, 0, 1); return x * x * x * (10 - 15 * x + 6 * x * x); };
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hexRGB(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(c1, c2, t) { const a = hexRGB(c1), b = hexRGB(c2); return `rgb(${(a[0] + (b[0] - a[0]) * t) | 0},${(a[1] + (b[1] - a[1]) * t) | 0},${(a[2] + (b[2] - a[2]) * t) | 0})`; }
function rgba(h, a) { const c = hexRGB(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function shade(h, k) { const c = hexRGB(h); return `rgb(${clamp(c[0] * k, 0, 255) | 0},${clamp(c[1] * k, 0, 255) | 0},${clamp(c[2] * k, 0, 255) | 0})`; }

/* sun / light state, shared by the shader and the 2D sprites */
function skyState(tod) {
  const ph = (tod - 0.25) * TAU;
  const el = 0.6 * Math.sin(ph);
  const az = -0.16 * Math.cos(ph);
  const sun = [Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)];
  const sy = sun[1];
  const N = 1 - sstep(-.20, .02, sy);
  const D = sstep(.14, .45, sy);
  const T = clamp(1 - N - D, 0, 1);
  const morn = tod < 0.5 ? 1 : 0;
  const rays = sstep(-.05, .05, sy) * (1 - sstep(.25, .55, sy)) * .9;
  const aur = N * sstep(.15, .8, N);
  return { sun, sy, N, D, T, morn, rays, aur, tod };
}

/* ===== GL: sky, sea, aurora, god rays (the HELIOS look) ===== */
const VS = `attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FS = `
precision highp float;
uniform vec2 uRes;
uniform float uTime,uHor,uF,uCh,uD,uCamX,uAur,uMorn,uFlash,uR,uFade,uRay;
uniform vec3 uSun,uFlashDir;
uniform vec2 uSunScr;
uniform float uYaw;
vec3 toW(vec3 v){float c=cos(uYaw),s=sin(uYaw);return vec3(v.x*c+v.z*s,v.y,-v.x*s+v.z*c);}

float hash(vec2 p){p=fract(p*vec2(233.34,851.73));p+=dot(p,p+23.45);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*vn(p);p=p*2.03+vec2(17.1,9.7);a*=.5;}return v;}

float isleR(float th){
  return uR*(1.+.07*sin(2.*th+.8)+.05*sin(3.*th+2.1)+.03*sin(5.*th+.3));
}

vec3 sunTint(){return mix(vec3(1.,.42,.14),vec3(1.,.95,.85),smoothstep(0.,.45,uSun.y));}

vec3 aurora(vec3 rd){
  float az=atan(rd.x,rd.z), el=asin(clamp(rd.y,0.,1.));
  vec3 col=vec3(0.);
  for(int i=0;i<3;i++){
    float fi=float(i);
    float c=.16+.07*fi+.045*sin(az*7.+uTime*.07+fi*1.7)+.03*sin(az*17.-uTime*.05+fi);
    float h=smoothstep(c-.012,c+.01,el)*exp(-(el-c)*(9.-fi*2.));
    float r=.5+.5*sin(az*(70.+fi*34.)+2.5*sin(az*9.+uTime*.2)+uTime*.13+fi*3.);
    r=pow(r,2.2)*.8+.2;
    float sh=.6+.4*sin(az*5.+uTime*.1+fi*2.);
    vec3 cc=mix(vec3(.12,1.,.55),vec3(.55,.25,1.),smoothstep(.16,.42,el+fi*.03));
    col+=cc*h*r*sh*(1.5/(1.+fi*.45));
  }
  return col*uAur;
}

vec3 stars(vec3 rd){
  vec2 uv=vec2(atan(rd.x,rd.z)+uTime*.0006,asin(clamp(rd.y,-1.,1.)))*vec2(260.,260.);
  vec2 id=floor(uv),f=fract(uv);
  float h=hash(id);
  if(h<.962) return vec3(0.);
  vec2 jp=vec2(hash(id+3.1),hash(id+7.7))*.6+.2;
  float d=length(f-jp);
  float tw=.65+.35*sin(uTime*(1.5+h*3.)+h*40.);
  float b=exp(-d*d*(60.+h*40.))*tw*(.35+(h-.962)*30.);
  vec3 c=mix(vec3(.75,.85,1.),vec3(1.,.9,.75),hash(id+9.));
  return c*b;
}

vec3 sky(vec3 rd,float full){
  rd=toW(rd);
  float sy=uSun.y;
  float N=1.-smoothstep(-.20,.02,sy);
  float Dd=smoothstep(.14,.45,sy);
  float T=clamp(1.-N-Dd,0.,1.);
  float y=max(rd.y,0.);
  vec3 dH=vec3(.80,.91,1.),dM=vec3(.30,.58,.95),dT=vec3(.08,.26,.72);
  vec3 sH=vec3(1.05,.42,.22),sM=vec3(.48,.20,.48),sT=vec3(.03,.04,.16);
  vec3 mH=vec3(1.,.58,.48),mM=vec3(.55,.36,.62),mT=vec3(.06,.10,.28);
  vec3 nH=vec3(.10,.16,.28),nM=vec3(.04,.06,.16),nT=vec3(.005,.008,.03);
  vec3 H=dH*Dd+mix(sH,mH,uMorn)*T+nH*N;
  vec3 M=dM*Dd+mix(sM,mM,uMorn)*T+nM*N;
  vec3 Tp=dT*Dd+mix(sT,mT,uMorn)*T+nT*N;
  vec3 c=mix(H,M,smoothstep(0.,.13,y));
  c=mix(c,Tp,smoothstep(.07,.45,y));
  c=mix(c,H*1.1,exp(-y*16.)*.45);
  vec3 st=sunTint();
  float sd=max(dot(rd,uSun),0.);
  float sunUp=smoothstep(-.10,.03,uSun.y);
  float cm=0.;
  if(full>.5){
    // clouds, streaky, lit from below by the low sun
    if(rd.y>0.){
      vec2 cp=rd.xz/(rd.y+.10)*1.3+vec2(uTime*.004,0.);
      float cn=fbm(cp*vec2(1.2,3.4)+vec2(3.,uTime*.003));
      cm=smoothstep(.5,.78,cn)*smoothstep(0.,.07,rd.y)*(1.-smoothstep(.3,.5,rd.y))*(1.-N);
      vec3 cl=mix(mix(vec3(.30,.22,.34),vec3(.55,.60,.72),Dd),st*1.25,pow(sd,2.)*(1.-Dd*.6));
      cl=mix(cl,cl*1.5+st*.35,smoothstep(.62,.9,cn)*(1.-Dd));
      c=mix(c,cl,cm*.78);
    }
    float occ=1.-cm*.5;
    c+=st*(pow(sd,7.)*.30+pow(sd,60.)*.55)*sunUp*(1.-N)*occ;
    c+=st*pow(sd,400.)*1.6*sunUp*occ;
    c+=st*smoothstep(.99955,.99985,dot(rd,uSun))*14.*sunUp*occ;
    // stars + milky way
    if(N>.01){
      vec3 s=stars(rd)*N*smoothstep(0.,.05,rd.y);
      vec3 mw=normalize(vec3(.35,.62,.70));
      float mwb=exp(-pow(dot(rd,mw)*3.4,2.))*fbm(rd.xz*8.+rd.y*5.)*.20;
      c+=s+vec3(.55,.62,1.)*mwb*N*smoothstep(0.,.08,rd.y);
      // moon
      vec3 mo=normalize(vec3(-.17,.30,.94));
      float md=dot(rd,mo);
      c+=vec3(.55,.65,.95)*pow(max(md,0.),900.)*.9*N+vec3(.7,.8,1.)*pow(max(md,0.),60.)*.10*N;
      if(md>.9996){
        vec3 t1=normalize(cross(mo,vec3(0.,1.,0.)));vec3 t2=cross(t1,mo);
        vec2 q=vec2(dot(rd,t1),dot(rd,t2))/.0283;
        float r2=dot(q,q);
        if(r2<1.){
          vec3 nn=vec3(q,sqrt(1.-r2));
          float lit=smoothstep(-.15,.55,dot(nn,normalize(vec3(.65,.25,.7))));
          float sh=.55+.45*fbm(q*3.6+4.);
          float e=1.-smoothstep(.90,1.,r2);
          c=mix(c,vec3(.96,.97,1.)*sh*(.22+.9*lit),e*N);
        }
      }
      c+=aurora(rd)*smoothstep(.01,.06,rd.y);
    }
    // supernova flash
    if(uFlash>0.){
      float fd=max(dot(rd,uFlashDir),0.);
      c+=vec3(.9,.95,1.)*(pow(fd,900.)*30.+pow(fd,60.)*1.4+pow(fd,6.)*.18)*uFlash;
    }
  }else{
    float hs=1.-.55*smoothstep(.1,.4,uSun.y);
    c+=st*(pow(sd,7.)*.30+pow(sd,60.)*.55)*sunUp*(1.-N)*hs;
    c+=st*pow(sd,400.)*1.6*sunUp*hs;
    c+=st*smoothstep(.99955,.99985,dot(rd,uSun))*14.*sunUp*hs;
    c+=vec3(.10,.55,.40)*uAur*.10*smoothstep(.0,.35,rd.y)*N;
    c+=vec3(.6,.7,1.)*pow(max(dot(rd,normalize(vec3(-.17,.30,.94))),0.),90.)*.5*N;
    c+=vec3(.9,.95,1.)*pow(max(dot(rd,uFlashDir),0.),60.)*1.4*uFlash;
  }
  return c;
}

void main(){
  vec2 frag=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);
  float N=1.-smoothstep(-.20,.02,uSun.y);
  float Dd=smoothstep(.14,.45,uSun.y);
  float T=clamp(1.-N-Dd,0.,1.);
  vec3 col;
  float dyp=frag.y-uHor;
  if(dyp<=0.5){
    vec3 rd=normalize(vec3((frag.x-uRes.x*.5)/uF,-dyp/uF,1.));
    col=sky(rd,1.);
  }else{
    float d=uF*uCh/dyp;
    float xw=uCamX+(frag.x-uRes.x*.5)*d/uF;
    vec2 P=vec2(xw,d-uD);
    vec2 Pw=vec2(P.x*cos(uYaw)+P.y*sin(uYaw),-P.x*sin(uYaw)+P.y*cos(uYaw));
    vec3 rd=normalize(vec3((frag.x-uRes.x*.5)/uF,-dyp/uF,1.));
    float t=uTime;
    float fd=1./(1.+d*.030);
    vec2 g=vec2(0.);
    // swell
    g+=vec2(.60,.80)*cos(dot(P,vec2(.60,.80))*.9+t*.7)*.090;
    g+=vec2(-.70,.50)*cos(dot(P,vec2(-.70,.50))*1.6+t*1.0)*.070;
    g+=vec2(.20,-.95)*cos(dot(P,vec2(.20,-.95))*2.7+t*1.4)*.050;
    g+=vec2(.90,.20)*cos(dot(P,vec2(.90,.20))*4.3+t*1.8)*.035;
    vec2 q=P*2.6+vec2(t*.25,-t*.15);
    g+=vec2(vn(q+vec2(.08,0.))-vn(q-vec2(.08,0.)),vn(q+vec2(0.,.08))-vn(q-vec2(0.,.08)))*.45;
    g*=fd;
    vec3 n=normalize(vec3(-g.x,1.,-g.y));
    vec3 r=reflect(rd,n);r.y=abs(r.y);
    vec3 rc=sky(normalize(r),0.);
    float cs=max(dot(n,-rd),0.);
    float F=.03+.97*pow(1.-cs,5.);
    float L=Dd+T*.45+N*.07;
    vec3 deep=mix(vec3(.005,.035,.075),vec3(.01,.30,.42),Dd)*mix(.55,1.,Dd+T*.5);
    deep=mix(deep,vec3(.035,.17,.23)+sunTint()*.03,T*.7);
    deep*=mix(.35,1.,smoothstep(0.,.6,L));
    // lagoon & foam around the island
    float ang=atan(Pw.y,Pw.x);
    float dist=length(Pw)-isleR(ang);
    float shallow=1.-smoothstep(0.,2.1,dist);
    vec3 lag=mix(vec3(.04,.55,.52),vec3(.08,.72,.66),Dd)*mix(.20,1.,smoothstep(0.,.7,L));
    lag=mix(lag,vec3(.55,.45,.25)*mix(.2,1.,L),(1.-smoothstep(0.,.55,dist))*.55);
    deep=mix(deep,lag,shallow*.9);
    vec3 col0=deep*(1.-F*.85)+rc*F;
    // glints
    col0+=sunTint()*pow(max(dot(toW(r),uSun),0.),700.)*9.*smoothstep(-.1,.03,uSun.y)*(1.-N)*(1.-.6*smoothstep(.1,.4,uSun.y));
    col0+=vec3(.7,.8,1.)*pow(max(dot(toW(r),normalize(vec3(-.17,.30,.94))),0.),500.)*6.*N;
    float fp=.30+.20*sin(t*.9+ang*3.+vn(Pw*1.5+t*.1)*4.);
    float foam=(1.-smoothstep(0.,.11,abs(dist-fp)))*(.45+.55*vn(Pw*7.+t*.3))*step(0.,dist);
    foam+=(1.-smoothstep(0.,.20,dist))*step(0.,dist)*(.35+.4*vn(Pw*9.-t*.2));
    foam+=(1.-smoothstep(0.,.10,abs(dist-(fp+.65+.25*sin(t*.7+ang*2.)))))*.35*vn(Pw*5.+t*.2);
    col0=mix(col0,vec3(.95,.98,1.)*mix(.4,1.,L),clamp(foam,0.,1.)*.8);
    col0=mix(col0,sky(vec3(rd.x*.2,.0,.98),0.),(1.-exp(-d*.010))*.35);
    // flash on water
    col0+=vec3(.5,.6,.9)*uFlash*.25;
    col=col0;
  }
  // god rays and bloom from the sun
  vec2 dv=frag-uSunScr;
  float rr=length(dv)/uF;
  float an=atan(dv.y,dv.x);
  float stk=pow(vn(vec2(an*9.,uTime*.05)),2.)*.8+pow(vn(vec2(an*23.+3.,uTime*.07)),3.)*.7+pow(vn(vec2(an*5.-2.,-uTime*.03)),2.)*.5;
  vec3 st=sunTint();
  col+=st*stk*exp(-rr*2.1)*uRay*.55;
  col+=st*exp(-rr*7.)*.30*uRay;
  // grade
  col*=1.-.22*pow(length((frag/uRes-.5)*vec2(1.,1.15)),2.2)*1.4;
  col=1.-exp(-col*1.25);
  col=pow(col,vec3(.92));
  col+=(hash(frag+uTime)-.5)*.012;
  gl_FragColor=vec4(col*uFade,1.);
}
`;

function makeHeadBase() {
  const PPU = 14, W = 32, H = 36, OX = W / 2, OY = 20;

/* a hand like the 10" wooden hand: a palm block, three-jointed fingers that curl towards the palm, a two-jointed thumb */

    let d = mkRotAx(f, n, 0), ax = mkNorm(mkCross(f, n)); // bend axis
    const sp = (i - 1.5) * spread * .5; d = mkRotAx(d, n, -sp * Math.sign(mkDot(th, w)) );

/* the smart shirt: button placket, white buttons, chest pocket with a little stitched mark; drawn on the front of the chest loft */

  for (let y = -71.5; y <= -45; y += 5) { const q = F(0, y); c.fillStyle = '#f2f1ec'; c.beginPath(); c.ellipse(q[0], q[1], .42 * Math.max(.35, cph), .42, 0, 0, TAU); c.fill(); c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.arc(q[0], q[1] + .05, .08, 0, TAU); c.fill(); }

  const P4 = [F(2.9, -71.4), F(7.5, -71.4), F(7.3, -65), F(5.2, -64.4), F(3.1, -65)];
  c.strokeStyle = 'rgba(0,0,0,.38)'; c.lineWidth = .28; c.beginPath(); P4.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath(); c.stroke();
  { const a = F(2.9, -70.6), b = F(7.5, -70.6); c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = .2; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); }

function drawCreature(c, cr, t) {
  if (creatureZ(cr) + cam.D < 3.5) { cr.hit = null; if (cr.ds) for (const d of cr.ds) d.hit = null; return; }
  const keep = YAW; if (cr.type !== 'shark') setYaw(cam.yaw - (cr.yaw0 || 0));
  if (cr.type === 'shark') drawShark(c, cr, t); else if (cr.type === 'dolphin') drawDolphinPod(c, cr, t); else if (cr.type === 'octo') drawOcto(c, cr, t); else drawWhale(c, cr, t);

}

  if (cr.type === 'dolphin') { for (const d of cr.ds) { d.ph = (.9 - cr.t + rnd(0, .5) + cr.P * 10) % cr.P; } return 'dolphin'; }
  if (cr.type === 'whale') { cr.nextBlow = cr.t; return 'whale'; }

}
function creatureHit(mx, my) {
  let best = null;
  for (const cr of creatures) {
    const hs = cr.type === 'dolphin' ? cr.ds.map(d => d.hit).filter(Boolean) : cr.hit ? [cr.hit] : [];
    for (const h of hs) if (Math.hypot(mx - h[0], my - h[1]) < h[2] + 10) best = cr;

}

/* ---------- the purple one-eyed octopus (from Ben's drawing) ---------- */
function drawOcto(c, o, t) {
  const W0 = proj(o.x, 0, o.z), k = W0[2], h = .55 + (1 - o.rise) * 2.6, bob = Math.sin(t * 1.7) * .06;
  const ink = '#2a0f45', body = '#9b5de5', dark = '#5b2a9e', cup = '#e9d2ff';
  const tent = (bx, by, a0, curl, L, w0, i) => {
    const pts = [[bx, by]]; let a = a0, x = bx, y = by; const n = 16, wv = (o.wave > 0 && Math.abs(Math.cos(a0)) > .9 ? Math.sin(t * 9) * .9 : 0);
    for (let j = 1; j <= n; j++) { const s = j / n; a = a0 + curl * s * s + (Math.sin(t * 2.1 + i * 1.3 - s * 3) * .35 + wv) * s; x += Math.cos(a) * L / n; y += Math.sin(a) * L / n; pts.push([x, y, a]); }

    for (let j = 0; j < n; j++) { const s = j / n, w = lerp(w0, w0 * .22, s); c.strokeStyle = s < .5 ? body : '#8a4fd6'; c.lineWidth = w - .03; c.beginPath(); c.moveTo(pts[j][0], pts[j][1]); c.lineTo(pts[j + 1][0], pts[j + 1][1]); c.stroke(); }
    const side = curl > 0 ? 1 : -1;
    for (let j = 2; j < n; j += 2) { const P = pts[j], s = j / n, w = lerp(w0, w0 * .22, s), nx = -Math.sin(P[2]) * side, ny = Math.cos(P[2]) * side; c.fillStyle = cup; c.strokeStyle = ink; c.lineWidth = .015; c.beginPath(); c.arc(P[0] + nx * w * .5, P[1] + ny * w * .5, w * .22, 0, TAU); c.fill(); c.stroke(); }
  };
  const draw = ghost => {
    c.save(); c.beginPath(); if (ghost) c.rect(0, W0[1], W, .9 * k); else c.rect(0, 0, W, W0[1]); c.clip();
    c.translate(W0[0], W0[1] + (ghost ? .25 * k : 0)); c.scale(k, k); c.translate(0, h + bob); c.rotate(o.lean || 0);
    if (ghost) c.globalAlpha = .22 * o.rise;
    // tentacles: two curl up out of the water at the sides, the rest hang below

      [-.18, -.22, Math.PI * .62, -1.2, 1.15, .16], [.18, -.22, Math.PI * .38, 1.2, 1.15, .16], [-.05, -.2, Math.PI * .53, -.6, 1.1, .15], [.06, -.2, Math.PI * .47, .6, 1.1, .15]];

    c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.ellipse(-.24, -1.45, .09, .2, -.2, 0, TAU); c.fill();

/* ===== Ben's voice =====
   Every line Ben says is spoken. If Ben (the real one) has recorded that line, his recording plays;
   otherwise the phone's own British voice reads it. Recordings are made in the Voice studio, kept on

/* ---- settings, embedded recordings, the phone's voice ---- */
try { const j = JSON.parse(localStorage.getItem('bc_voice') || '{}'); if (j.on != null) VOICE.on = !!j.on; if (j.asWeGo != null) VOICE.asWeGo = !!j.asWeGo; if (j.onlyNew != null) VOICE.onlyNew = !!j.onlyNew; } catch (e) { }

  if (!('speechSynthesis' in window)) return; const vs = speechSynthesis.getVoices(); if (!vs.length) return;
  const pref = ['Daniel', 'Arthur', 'Oliver', 'Google UK English Male', 'Rishi', 'Malcolm'];
  VOICE.voice = pref.map(n => vs.find(v => v.name.indexOf(n) === 0 && /en[-_]GB/i.test(v.lang))).find(Boolean) || vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}

/* ---- recordings kept on this phone (IndexedDB) ---- */
let vDB = null;
function vOpenDB() { return new Promise(res => { try { const r = indexedDB.open('bencrusoe-voice', 1); r.onupgradeneeded = () => r.result.createObjectStore('clips'); r.onsuccess = () => { vDB = r.result; res(vDB); }; r.onerror = () => res(null); } catch (e) { res(null); } }); }

}, true);

/* ---- speaking ---- */
function voiceStop() {
  if (VOICE.audio) { try { VOICE.audio.pause(); } catch (e) { } VOICE.audio = null; }
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) { }
  VOICE.playing = false; VOICE.bnd = false; VOICE.gap = null;
}
function voiceSay(text) {

  const words = Math.max(1, vNorm(text).split(' ').length), h = vHash(text), src = VOICE.local[h] || VOICE.emb[h], now = performance.now();

    a.play().catch(() => { if (VOICE.audio === a) VOICE.playing = false; });

    VOICE.gap = .37;

    u.onboundary = e => { if (VOICE.utt !== u || e.charIndex == null) return; VOICE.bnd = true; let n = talk.text.indexOf(' ', e.charIndex + 1); if (n < 0) n = talk.text.length; if (talk.text === VOICE.line) talk.shown = Math.max(talk.shown, n); };

/* the talk engine asks these: how long until the next word, and whether he's still speaking */
function voiceGap(word) { if (!VOICE.playing) return null; if (VOICE.bnd) return 1.2; return VOICE.gap + (/[.,!?;:]$/.test(word.trim()) ? .12 : 0); }

  if (talk.text !== VOICE.line) { VOICE.line = talk.text; voiceSay(talk.text); }

/* ---- every line Ben can say, for the studio ---- */
function vGatherLines() {
  const out = [], seen = new Set(), add = (t, ctx) => { if (typeof t !== 'string') return; const n = vNorm(t); if (n.length < 2 || seen.has(n)) return; seen.add(n); out.push({ t: n, ctx }); };

  if (typeof TOPICS !== 'undefined') for (const tp of TOPICS) for (const l of tp.lines) add(l, (tp.k === 'game' ? 'Game · ' + (tp.name || tp.id) : tp.k === 'joke' ? 'Joke' : 'Story') );
  if (typeof MEMS !== 'undefined') for (const m of MEMS) for (const l of m.lines) add(l, 'Memory · ' + m.t);
  if (typeof QUIPS !== 'undefined') for (const k in QUIPS) for (const t of [].concat(QUIPS[k])) add(t, 'Quick line · ' + k);

}
function updateCoconuts(dt) {

    for (const s of pl.coc) { if (s.ripe < 1) { if (s.wait > 0) s.wait -= dt; else s.ripe = Math.min(1, s.ripe + dt / 16); } }

    f.t += dt;
    if (f.st === 'fall') {
